# Runs the whole stack (API + Postgres) with a single command:
#   docker compose up
#
# Values wrapped in ${...} are read from your .env file (see .env.example).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume => data survives `docker compose down` and restarts.
      - pgdata:/var/lib/postgresql/data
      # Schema is applied once, on first volume creation.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      # Inside the compose network the database host is the service name `db`.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REPO: postgres
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        # Wait until Postgres is actually ready to accept connections.
        condition: service_healthy

volumes:
  pgdata:
