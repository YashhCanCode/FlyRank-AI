<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yash — Backend Engineer</title>
  <meta name="description" content="Backend APIs where the database is just a detail." />

  <!-- Favicon (identity kit) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Fonts (identity kit: Space Grotesk headings, Inter body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    /* Identity kit palette */
    :root {
      --ink: #18181B;
      --bg: #FAFAFA;
      --primary: #0F172A;
      --accent: #0F766E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      line-height: 1.6;
    }
    main { max-width: 40rem; text-align: center; }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      border-radius: 14px;
      background: var(--primary);
      color: var(--bg);
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      margin-bottom: 2rem;
    }
    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .claim {
      margin-top: 1rem;
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      color: var(--ink);
    }
    .tag { color: var(--accent); font-weight: 500; }
    .soon {
      margin-top: 2.5rem;
      font-size: 0.9rem;
      color: #71717A;
      border-top: 1px solid #E4E4E7;
      padding-top: 1.5rem;
    }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="mark">Y</div>
    <h1>Yash</h1>
    <p class="claim">
      I build backend APIs where the database is just a detail —
      <span class="tag">swap it, and the contract still holds.</span>
    </p>
    <p class="soon">
      Portfolio in progress · <a href="https://github.com/">GitHub</a>
    </p>
  </main>
</body>
</html>
